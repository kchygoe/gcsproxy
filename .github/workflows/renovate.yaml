name: Renovate
on:
  workflow_dispatch: {}
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Get token
        id: get_token
        uses: tibdex/github-app-token@32691ba7c9e7063bd457bd8f2a5703138591fa58 # v1
        with:
          private_key: ${{ secrets.PRIVATE_KEY }}
          app_id: ${{ secrets.RENOVATE_APP_ID }}
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@23a02fe7be9e93f857a953cc8162e57d2c8401ef # v39.0.1
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.get_token.outputs.token }}
        env:
          RENOVATE_USERNAME: "kchygoe-renovate[bot]"
          RENOVATE_GIT_AUTHOR: "381335-+kchygoe-renovate[bot]@users.noreply.github.com"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: "kchygoe/gcsproxy"
