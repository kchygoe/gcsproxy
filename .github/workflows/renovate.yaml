name: Renovate
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.get_token.outputs.token }}
        env:
          RENOVATE_USERNAME: "kchygoe-renovate[bot]"
          RENOVATE_GIT_AUTHOR: "381335-+kchygoe-renovate[bot]@users.noreply.github.com"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: "kchygoe/gcsproxy"
